server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # No trailing slash on proxy_pass: preserve the /api prefix for Express.
    location ~ ^/api(?:/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backup/restore processes may take up to 30 minutes.
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control 'no-cache';
    }
    # HashRouter fragments stay in the browser; SPA fallback also handles reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
